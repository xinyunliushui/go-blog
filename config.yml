# 系统配置
application:
  # 端口
  port: 8080
  # 路径前缀
  url_path_prefix: api
  # 可选：生产环境填写浏览器访问前端的完整 Origin（可多项），与 Access-Control-Allow-Credentials 配合使用
  # cors_allow_origins: http://localhost:3000
  # rsa公钥文件路径(config.yml相对路径, 也可以填绝对路径)
  rsa_public_key: go-blog-pub.pem
  # rsa私钥文件路径(config.yml相对路径, 也可以填绝对路径)
  rsa_private_key: go-blog-priv.pem
# mysql配置
mysql:
  # 用户名
  username: root
  # 密码
  password: blogY1Jo)%
  # 数据库名
  database: go_blog
  # 主机地址
  host: localhost
  # 端口
  port: 3306
  # 连接字符串参数
  query: parseTime=True&loc=Local&timeout=10000ms
  # 是否打印日志
  log_mode: true
  # 数据库表前缀(无需再末尾添加下划线, 程序内部自动处理)
  # table_prefix: go_blog
  # 编码方式
  charset: utf8mb4
  # 字符集(utf8mb4_general_ci速度比utf8mb4_unicode_ci快些)
  collation: utf8mb4_general_ci

# casbin配置
casbin:
  # 模型配置文件, config.yml相对路径
  model_path: 'rbac_model.conf'

# jwt配置
jwt:
  # jwt标识
  realm: blog-admin-realm
  # 服务端密钥
  key: blog-secret-key
  # token过期时间, 小时
  timeout: 2
  # 刷新token最大过期时间, 小时
  max_refresh: 2

logs:
  # 日志等级(-1:Debug, 0:Info, 1:Warn, 2:Error, 3:DPanic, 4:Panic, 5:Fatal, -1<=level<=5)
  level: 1
  # 日志路径
  path: logs
  # 文件最大大小, M
  max-size: 50
  # 备份数
  max-backups: 1
  # 存放时间, 天
  max-age: 7
  # 是否压缩
  compress: false